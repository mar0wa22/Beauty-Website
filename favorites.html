<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">

    <link rel="icon" type="image/png" href="images/icons.png">

    <link rel="apple-touch-icon" href="images/icons.png">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <title>Femora Beauty - Favorites</title>

</head>


<body>


<!-- =========================================
     NAVBAR
========================================= -->

<nav>

    <div class="nav__header">

        <div class="nav__logo">

            <a href="index.html">

                <h1>

                    <span style="color:#d17b88;">
                        ✨ Femora
                    </span>

                    <span style="color:#4acfee;">
                        Beauty
                    </span>

                </h1>

            </a>

        </div>


        <div class="nav__menu__btn"
             id="menu-btn">

            <i class="ri-menu-3-line"></i>

        </div>

    </div>


    <ul class="nav__links"
        id="nav-links">


        <li>

            <a href="index.html"
               data-i18n="home">

                Home

            </a>

        </li>


        <li>

            <a href="about.html"
               data-i18n="about">

                About

            </a>

        </li>


        <li>

            <a href="products.html"
               data-i18n="products">

                Products

            </a>

        </li>


        <li>

            <a href="contacts.html"
               data-i18n="contact">

                Contact Us

            </a>

        </li>


        <li>

            <a href="favorites.html">

               

                <span data-i18n="favorites">
                    Favorites
                </span>
                <i class="ri-heart-line"></i>
            </a>

        </li>

    <li>

            <a href="cart.html">

              

                <span data-i18n="cart">
                    Cart
                </span>
                <i class="ri-shopping-bag-3-line"></i>
            </a>

        </li>

    <li class="language-item">

        <button
            id="language-toggle"
            class="language-toggle"
            onclick="toggleLanguage()">

            AR

        </button>

    </li>

        <li>

            <button class="btn"
                    onclick="window.location.href='products.html'">

                <span data-i18n="shopNow">
                    Shop Now
                </span>

                <span>

                    <i class="ri-arrow-right-long-line"></i>

                </span>

            </button>

        </li>

    </ul>



</nav>



<!-- =========================================
     FAVORITES
========================================= -->

<section class="favorites-section">


    <div class="favorites-heading">


        <span data-i18n="favoritesSmallTitle">

            YOUR FAVORITES

        </span>


        <h1>

            <span data-i18n="favoritesTitleYour">

                Your Beauty

            </span>


            <strong data-i18n="favoritesTitle">

                Favorites

            </strong>

        </h1>


        <p data-i18n="favoritesDescription">

            Products you love and want to keep close.

        </p>


    </div>



    <div
        class="favorites-grid"
        id="favorites-container">

    </div>


</section>

<script src="translations.js"></script>

<script>

    /* =========================================
       GET FAVORITES
    ========================================= */

    let favorites =
        JSON.parse(
            localStorage.getItem("femoraFavorites")
        ) || [];


    const favoritesContainer =
        document.getElementById(
            "favorites-container"
        );


    /* =========================================
       DISPLAY FAVORITES
    ========================================= */

    function displayFavorites() {

        favoritesContainer.innerHTML = "";

        const t =
            translations[currentLanguage];


        if (favorites.length === 0) {

            favoritesContainer.innerHTML = `

                <div class="empty-favorites">

                    <i class="ri-heart-3-line"></i>

                    <h2>
                        ${t.noFavoritesYet}
                    </h2>

                    <p>
                        ${t.noFavoritesDescription}
                    </p>

                    <a href="products.html">

                        ${t.exploreProducts}

                        <i class="ri-arrow-right-line"></i>

                    </a>

                </div>

            `;

            return;
        }


        favorites.forEach((product, index) => {

            const card =
                document.createElement("div");

            card.className =
                "favorite-card";


            card.innerHTML = `

                <div class="favorite-image">

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                        onerror="this.src='images/1.png'"
                    >

                    <button
                        class="remove-favorite"
                        data-index="${index}"
                        title="${t.removeFromFavorites}">

                        <i class="ri-heart-fill"></i>

                    </button>

                </div>


                <div class="favorite-info">

                    <span>
                        ${t.femoraBeauty}
                    </span>

                    <h3>
                        ${product.name}
                    </h3>

                    <strong>
                        $${product.price}.00
                    </strong>

                    <button
                        class="remove-button"
                        data-index="${index}">

                        <i class="ri-delete-bin-line"></i>

                        ${t.remove}

                    </button>

                </div>

            `;


            favoritesContainer.appendChild(card);

        });


        /* REMOVE HEART */

        document
            .querySelectorAll(".remove-favorite")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    function () {

                        const index =
                            Number(this.dataset.index);

                        favorites.splice(index, 1);

                        localStorage.setItem(
                            "femoraFavorites",
                            JSON.stringify(favorites)
                        );

                        displayFavorites();

                    }
                );

            });


        /* REMOVE BUTTON */

        document
            .querySelectorAll(".remove-button")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    function () {

                        const index =
                            Number(this.dataset.index);

                        favorites.splice(index, 1);

                        localStorage.setItem(
                            "femoraFavorites",
                            JSON.stringify(favorites)
                        );

                        displayFavorites();

                    }
                );

            });

    }


    /* =========================================
       MOBILE MENU
    ========================================= */

    const menuBtn =
        document.getElementById("menu-btn");

    const navLinks =
        document.getElementById("nav-links");


    if (menuBtn && navLinks) {

        menuBtn.addEventListener(
            "click",
            () => {

                navLinks.classList.toggle("open");

            }
        );

    }


    /* =========================================
       START
    ========================================= */

    displayFavorites();


    /* =========================================
       LANGUAGE CHANGE
    ========================================= */

    const originalToggleLanguage =
        window.toggleLanguage;


    window.toggleLanguage =
        function () {

            originalToggleLanguage();

            displayFavorites();

        };

</script>
</body>

</html>
